default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV["DATABASE_PORT"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  database: agency_os_test

production:
  primary: &primary_production
    <<: *default
    database: agency_os_production
    username: <%= ENV["DATABASE_USERNAME"] %>
    password: <%= ENV["AGENCY_OS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: agency_os_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: agency_os_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: agency_os_production_cable
    migrations_paths: db/cable_migrate
